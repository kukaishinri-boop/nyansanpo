<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>にゃんさんぽ</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="にゃんさんぽ">
  <meta name="theme-color" content="#7c9a6e">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #faf8f5; }
    #loginOverlay {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: #faf8f5; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 20px; padding: 40px; text-align: center; z-index: 10;
    }
    #loginOverlay img { width: 96px; height: 96px; border-radius: 50%; }
    #loginOverlay h1 { font-size: 20px; font-weight: bold; color: #3d3530; font-family: 'Hiragino Sans', sans-serif; }
    #loginOverlay p { font-size: 13px; color: #8a7f78; font-family: 'Hiragino Sans', sans-serif; }
    #frame { width: 100%; height: 100%; border: none; display: block; }
  </style>
</head>
<body>

<div id="loginOverlay">
  <img src="icon.png" alt="にゃんさんぽ">
  <h1>にゃんさんぽ</h1>
  <p>Googleアカウントでサインインしてください</p>
  <div id="g_id_onload"
    data-client_id="487702316952-jt89o39d2lc8ku7hijlfnbbtek9cc71e.apps.googleusercontent.com"
    data-callback="onGoogleSignIn"
    data-auto_select="true"
    data-itp_support="true">
  </div>
  <div class="g_id_signin"
    data-type="standard"
    data-size="large"
    data-theme="outline"
    data-text="sign_in_with"
    data-shape="pill"
    data-locale="ja">
  </div>
</div>

<iframe id="frame" style="display:none"
  src="https://script.google.com/macros/s/AKfycbxIA-U_2GAGw6giWUT-6f3X6Y72euXXx7wZZdSG8TMtk-p88NU3xam721gVEInFmWav/exec"
  allow="geolocation; camera">
</iframe>

<script>
var _userEmail = '';

function parseJwt(token) {
  var base64 = token.split('.')[1].replace(/-/g, '+').replace(/_/g, '/');
  var json = decodeURIComponent(atob(base64).split('').map(function(c) {
    return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
  }).join(''));
  return JSON.parse(json);
}

function onGoogleSignIn(response) {
  var payload = parseJwt(response.credential);
  _userEmail = payload.email || '';
  localStorage.setItem('nyan_email', _userEmail);
  showApp();
}

function showApp() {
  document.getElementById('loginOverlay').style.display = 'none';
  document.getElementById('frame').style.display = 'block';
}

// iframeからemailリクエストが来たら返す
window.addEventListener('message', function(e) {
  if (e.data && e.data.type === 'getEmail') {
    e.source.postMessage({ type: 'email', email: _userEmail }, '*');
  }
});

// 前回のログイン情報があればスキップ
var saved = localStorage.getItem('nyan_email');
if (saved) {
  _userEmail = saved;
  showApp();
}
</script>
</body>
</html>
